<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Helvetica,Arial,sans-serif">
  <title>Share Card export — wireframe</title>
  <rect width="320" height="680" rx="28" fill="#F2F2F7"/>
  <rect width="320" height="28" fill="#F2F2F7"/>
  <text x="160" y="18" font-size="10" text-anchor="middle" fill="#8E8E93">9:41</text>
  <rect x="0" y="28" width="320" height="48" fill="#FFFFFF"/>
  <text x="16" y="58" font-size="15" fill="#3A3A3C">✕</text>
  <text x="40" y="58" font-size="15" font-weight="bold" fill="#1C1C1E">Share Card</text>
  <line x1="0" y1="76" x2="320" y2="76" stroke="#E5E5EA" stroke-width="1"/>

  <!-- rendered card preview -->
  <rect x="60" y="100" width="200" height="360" rx="18" fill="#1E7A3D"/>
  <text x="160" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Ethiopia Guji</text>
  <text x="160" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Natural</text>
  <text x="160" y="196" font-size="10" text-anchor="middle" fill="#DFF7E5">Roaster: (user's own text) · Guji</text>
  <polygon points="160,220 190,240 178,278 142,278 130,240" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="160" y="320" font-size="11" text-anchor="middle" fill="#DFF7E5">Score 4.5 · Well extracted</text>
  <circle cx="128" cy="420" r="14" fill="#FFFFFF"/>
  <text x="128" y="424" font-size="9" text-anchor="middle" fill="#1E7A3D">av</text>
  <text x="150" y="424" font-size="9" fill="#DFF7E5">coffee-can — app's own branding, subordinate</text>
  <text x="150" y="436" font-size="9" fill="#DFF7E5">to the user's data (specs/legal-android.md §3.3)</text>

  <text x="12" y="486" font-size="9" fill="#AEAEB2">Rendered locally (Compose Canvas). No roaster</text>
  <text x="12" y="498" font-size="9" fill="#AEAEB2">logo graphic reproduced — name as text only.</text>

  <rect x="20" y="600" width="280" height="42" rx="21" fill="#34C759"/>
  <text x="160" y="626" font-size="13" text-anchor="middle" fill="#FFFFFF">Share ⤴  (Android share sheet)</text>
</svg>
