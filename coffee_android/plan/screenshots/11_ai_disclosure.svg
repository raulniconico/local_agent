<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Helvetica,Arial,sans-serif">
  <title>AI disclosure &amp; consent — wireframe</title>
  <rect width="320" height="680" rx="28" fill="#F2F2F7"/>
  <rect width="320" height="680" fill="#000000" opacity="0.4"/>
  <rect x="24" y="190" width="272" height="360" rx="20" fill="#FFFFFF"/>

  <circle cx="160" cy="240" r="26" fill="#DFF7E5"/>
  <text x="160" y="247" font-size="18" text-anchor="middle" fill="#248A3D">✦</text>

  <text x="160" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#1C1C1E">This uses an AI service</text>

  <text x="45" y="318" font-size="10.5" fill="#3A3A3C">Your photo will be sent over the</text>
  <text x="45" y="334" font-size="10.5" fill="#3A3A3C">internet to an AI service to read the</text>
  <text x="45" y="350" font-size="10.5" fill="#3A3A3C">label and suggest brew settings.</text>

  <text x="45" y="374" font-size="10.5" fill="#3A3A3C">What's sent: the photo, and the</text>
  <text x="45" y="390" font-size="10.5" fill="#3A3A3C">bean/session details you've entered.</text>

  <text x="45" y="414" font-size="10.5" fill="#3A3A3C">You can still add everything by hand</text>
  <text x="45" y="430" font-size="10.5" fill="#3A3A3C">without using this feature.</text>

  <line x1="45" y1="452" x2="275" y2="452" stroke="#E5E5EA"/>
  <text x="45" y="470" font-size="9" fill="#8E8E93">Shown once · see full Privacy Policy</text>

  <rect x="45" y="486" width="230" height="40" rx="20" fill="#F2F2F7"/>
  <text x="160" y="510" font-size="11" text-anchor="middle" fill="#3A3A3C">Not now</text>

  <text x="12" y="576" font-size="9" fill="#AEAEB2">No direct ancestor in the desktop app — designed</text>
  <text x="12" y="588" font-size="9" fill="#AEAEB2">fresh against specs/legal-android.md §2.1/§3.1</text>
  <text x="12" y="600" font-size="9" fill="#AEAEB2">rule 4. Affirmative tap required; no auto-dismiss.</text>

  <rect x="20" y="612" width="280" height="42" rx="21" fill="#34C759"/>
  <text x="160" y="638" font-size="13" text-anchor="middle" fill="#FFFFFF">Continue</text>
</svg>
