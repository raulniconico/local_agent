<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Helvetica,Arial,sans-serif">
  <title>Bean Detail — wireframe</title>
  <rect width="320" height="680" rx="28" fill="#F2F2F7"/>
  <rect width="320" height="28" fill="#F2F2F7"/>
  <text x="160" y="18" font-size="10" text-anchor="middle" fill="#8E8E93">9:41</text>
