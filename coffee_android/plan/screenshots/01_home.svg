<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Helvetica,Arial,sans-serif">
  <title>Home — wireframe</title>
  <rect width="320" height="680" rx="28" fill="#F2F2F7"/>
  <!-- status bar -->
  <rect width="320" height="28" fill="#F2F2F7"/>
  <text x="160" y="18" font-size="10" text-anchor="middle" fill="#8E8E93">9:41</text>
  <!-- app bar -->
  <rect x="0" y="28" width="320" height="48" fill="#FFFFFF"/>
  <text x="16" y="58" font-size="17" font-weight="bold" fill="#1C1C1E">coffee-can</text>
  <circle cx="296" cy="52" r="12" fill="#F2F2F7"/>
  <text x="296" y="56" font-size="11" text-anchor="middle" fill="#3A3A3C">⚙</text>
  <line x1="0" y1="76" x2="320" y2="76" stroke="#E5E5EA" stroke-width="1"/>

  <!-- section: bean list -->
  <text x="16" y="98" font-size="12" fill="#8E8E93">COFFEE PROFILES</text>
  <g>
    <rect x="12" y="106" width="296" height="56" rx="14" fill="#FFFFFF"/>
    <text x="24" y="128" font-size="14" font-weight="bold" fill="#1C1C1E">Ethiopia Guji Natural</text>
    <text x="24" y="146" font-size="11" fill="#8E8E93">Natural · Roasted 07-28 · 4 sessions</text>
  </g>
  <g>
    <rect x="12" y="168" width="296" height="56" rx="14" fill="#FFFFFF"/>
    <text x="24" y="190" font-size="14" font-weight="bold" fill="#1C1C1E">Colombia Huila Washed</text>
    <text x="24" y="208" font-size="11" fill="#8E8E93">Washed · Roasted 07-20 · 2 sessions</text>
  </g>

  <!-- activity heatmap -->
  <text x="16" y="248" font-size="12" fill="#8E8E93">BREWING ACTIVITY</text>
  <rect x="12" y="256" width="296" height="70" rx="14" fill="#FFFFFF"/>
  <g fill="#34C759">
    <rect x="24" y="268" width="10" height="10" opacity="0.9"/>
    <rect x="38" y="268" width="10" height="10" opacity="0.3"/>
    <rect x="52" y="268" width="10" height="10" opacity="0.6"/>
    <rect x="66" y="268" width="10" height="10" opacity="0.1"/>
    <rect x="80" y="268" width="10" height="10" opacity="0.9"/>
    <rect x="24" y="282" width="10" height="10" opacity="0.1"/>
    <rect x="38" y="282" width="10" height="10" opacity="0.6"/>
    <rect x="52" y="282" width="10" height="10" opacity="0.3"/>
    <rect x="66" y="282" width="10" height="10" opacity="0.9"/>
    <rect x="80" y="282" width="10" height="10" opacity="0.1"/>
  </g>
  <text x="24" y="312" font-size="10" fill="#8E8E93">GitHub-style contribution calendar</text>

  <!-- flavor radar -->
  <text x="16" y="346" font-size="12" fill="#8E8E93">MY FLAVOR</text>
  <rect x="12" y="354" width="296" height="110" rx="14" fill="#FFFFFF"/>
  <polygon points="160,368 195,392 182,432 138,432 125,392" fill="none" stroke="#34C759" stroke-width="2"/>
  <circle cx="160" cy="400" r="2" fill="#34C759"/>
  <text x="160" y="452" font-size="10" text-anchor="middle" fill="#8E8E93">11-axis radar, app-wide average</text>

  <!-- can drink strip -->
  <text x="16" y="486" font-size="12" fill="#8E8E93">CAN DRINK</text>
  <text x="296" y="486" font-size="11" text-anchor="end" fill="#34C759">more ›</text>
  <rect x="12" y="494" width="90" height="90" rx="12" fill="#FFFFFF"/>
  <rect x="20" y="502" width="74" height="50" rx="8" fill="#E5E5EA"/>
  <text x="20" y="566" font-size="10" fill="#1C1C1E">Kenya AA</text>
  <text x="20" y="578" font-size="9" fill="#8E8E93">Lomi · €16</text>
  <rect x="115" y="494" width="90" height="90" rx="12" fill="#FFFFFF"/>
  <rect x="123" y="502" width="74" height="50" rx="8" fill="#E5E5EA"/>
  <rect x="218" y="494" width="90" height="90" rx="12" fill="#FFFFFF"/>
  <rect x="226" y="502" width="74" height="50" rx="8" fill="#E5E5EA"/>

  <!-- FAB -->
  <circle cx="280" cy="620" r="26" fill="#34C759"/>
  <text x="280" y="627" font-size="22" text-anchor="middle" fill="#FFFFFF">+</text>
  <text x="12" y="650" font-size="9" fill="#AEAEB2">Tap a card → Bean Detail. FAB → new profile.</text>
</svg>
