<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Helvetica,Arial,sans-serif">
  <title>Can-Drink Catalogue — wireframe</title>
  <rect width="320" height="680" rx="28" fill="#F2F2F7"/>
  <rect width="320" height="28" fill="#F2F2F7"/>
  <text x="160" y="18" font-size="10" text-anchor="middle" fill="#8E8E93">9:41</text>
  <rect x="0" y="28" width="320" height="48" fill="#FFFFFF"/>
  <text x="16" y="58" font-size="15" fill="#3A3A3C">‹</text>
  <text x="40" y="58" font-size="15" font-weight="bold" fill="#1C1C1E">Can Drink</text>
  <line x1="0" y1="76" x2="320" y2="76" stroke="#E5E5EA" stroke-width="1"/>

  <!-- filters -->
  <rect x="12" y="86" width="296" height="34" rx="17" fill="#FFFFFF"/>
  <text x="24" y="107" font-size="11" fill="#8E8E93">🔍 Search names…</text>
  <rect x="12" y="128" width="90" height="26" rx="13" fill="#34C759"/>
  <text x="57" y="145" font-size="9" text-anchor="middle" fill="#FFFFFF">All roasters ▾</text>
  <rect x="108" y="128" width="80" height="26" rx="13" fill="#FFFFFF"/>
  <text x="148" y="145" font-size="9" text-anchor="middle" fill="#3A3A3C">Origin ▾</text>
  <rect x="194" y="128" width="114" height="26" rx="13" fill="#FFFFFF"/>
  <text x="251" y="145" font-size="9" text-anchor="middle" fill="#3A3A3C">✓ In stock only</text>
  <text x="12" y="176" font-size="9" fill="#AEAEB2">Roaster chips replace the desktop app's separate</text>
  <text x="12" y="188" font-size="9" fill="#AEAEB2">"What's New" per-roaster screen (merged here).</text>

  <!-- grid -->
  <rect x="12" y="200" width="142" height="180" rx="14" fill="#FFFFFF"/>
  <rect x="20" y="208" width="126" height="90" rx="10" fill="#E5E5EA"/>
  <text x="24" y="312" font-size="10" fill="#1C1C1E">Kenya AA</text>
  <text x="24" y="326" font-size="9" fill="#8E8E93">Lomi · Kenya</text>
  <text x="24" y="340" font-size="9" fill="#8E8E93">€16 · 250g</text>
  <rect x="24" y="350" width="46" height="16" rx="8" fill="#DFF7E5"/>
  <text x="47" y="362" font-size="7" text-anchor="middle" fill="#248A3D">In stock</text>

  <rect x="166" y="200" width="142" height="180" rx="14" fill="#FFFFFF"/>
  <rect x="174" y="208" width="126" height="90" rx="10" fill="#E5E5EA"/>
  <text x="178" y="312" font-size="10" fill="#1C1C1E">Panama Geisha</text>
  <text x="178" y="326" font-size="9" fill="#8E8E93">Tanat · Panama</text>
  <text x="178" y="340" font-size="9" fill="#8E8E93">€42 · 100g</text>

  <rect x="12" y="390" width="142" height="180" rx="14" fill="#FFFFFF"/>
  <rect x="20" y="398" width="126" height="90" rx="10" fill="#E5E5EA"/>
  <rect x="166" y="390" width="142" height="180" rx="14" fill="#FFFFFF"/>
  <rect x="174" y="398" width="126" height="90" rx="10" fill="#E5E5EA"/>

  <text x="12" y="600" font-size="9" fill="#AEAEB2">GET /v1/catalogue — server-cached, never a</text>
  <text x="12" y="612" font-size="9" fill="#AEAEB2">per-device scrape (specs/legal-android.md §4).</text>
  <text x="12" y="624" font-size="9" fill="#AEAEB2">Photos hotlinked live via Coil, never stored.</text>
  <text x="12" y="640" font-size="9" fill="#AEAEB2">Tap card → opens product_url in browser.</text>
</svg>
