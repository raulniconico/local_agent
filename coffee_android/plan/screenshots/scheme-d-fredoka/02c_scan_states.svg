<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif">
<title>Bean Detail — scan states (state sheet, not a screen)</title>

<rect width="360" height="800" fill="#F2FAF2"/>
<text x="16" y="16" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#515D51">8:24</text>
<rect x="296" y="17" width="3" height="4" fill="#515D51" rx="1"/>
<rect x="301" y="15" width="3" height="6" fill="#515D51" rx="1"/>
<rect x="306" y="13" width="3" height="8" fill="#515D51" rx="1"/>
<rect x="311" y="11" width="3" height="10" fill="#515D51" rx="1"/>
<path d="M320 15 q5 -4 10 0 M323 18 q2.5 -2 5 0" fill="none" stroke="#515D51" stroke-width="1.4"/>
<rect x="334" y="9" width="18" height="9" fill="none" rx="2" stroke="#515D51" stroke-width="1"/>
<rect x="336" y="11" width="11" height="5" fill="#515D51" rx="1"/>
<path d="M32 49.0 l-7 7 l7 7" fill="none" stroke="#1B241C" stroke-width="2"/>
<text x="56" y="64.0" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="16" font-weight="600" fill="#1B241C">Scan states</text>
<line x1="0" y1="88" x2="360" y2="88" stroke="#C3D3C4" stroke-width="1"/>
<text x="20" y="124" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#1B241C">Scanning</text>
<rect x="16" y="136" width="328" height="168" fill="#FFFFFF" rx="24"/>
<rect x="32" y="152" width="88" height="112" fill="#E0EFE1" rx="2"/>
<rect x="128" y="152" width="88" height="112" fill="#E0EFE1" rx="2"/>
<rect x="32" y="152" width="296" height="112" fill="#F2FAF2" rx="8" opacity="0.72"/>
<path d="M180 192 a16 16 0 1 1 -11.2 4.6" fill="none" stroke="#196D2E" stroke-width="3"/>
<text x="180" y="250" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="400" fill="#515D51" text-anchor="middle">Reading the label…</text>
<text x="180" y="288" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#6D7B6D" text-anchor="middle">You can keep typing while this runs</text>
<text x="20" y="352" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#1B241C">Couldn't reach the server</text>
<rect x="16" y="364" width="328" height="152" fill="#FFFFFF" rx="24"/>
<rect x="16" y="380" width="328" height="56" fill="#FEDED7" rx="12"/>
<circle cx="36" cy="400" r="8" fill="none" stroke="#84241A" stroke-width="1.5"/>
<text x="36" y="404" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="12" font-weight="600" fill="#84241A" text-anchor="middle">!</text>
<text x="54" y="405" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="400" fill="#84241A">You're offline — the scan needs a connection.</text>
<text x="54" y="423" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="400" fill="#84241A">Everything on this form still saves locally.</text>
<rect x="32" y="456.0" width="130" height="40" fill="none" rx="8" stroke="#6D7B6D" stroke-width="1"/>
<text x="97.0" y="481.0" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#1B241C" text-anchor="middle">Try again</text>
<text x="251.0" y="481.0" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#196D2E" text-anchor="middle">Enter by hand</text>
<text x="20" y="572" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#1B241C">Photo unreadable</text>
<rect x="16" y="584" width="328" height="152" fill="#FFFFFF" rx="24"/>
<rect x="16" y="600" width="328" height="56" fill="#FEDED7" rx="12"/>
<circle cx="36" cy="620" r="8" fill="none" stroke="#84241A" stroke-width="1.5"/>
<text x="36" y="624" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="12" font-weight="600" fill="#84241A" text-anchor="middle">!</text>
<text x="54" y="625" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="400" fill="#84241A">Couldn't read much from this photo.</text>
<text x="54" y="643" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="400" fill="#84241A">Try better light, or fill the fields in by hand.</text>
<rect x="32" y="676.0" width="130" height="40" fill="none" rx="8" stroke="#6D7B6D" stroke-width="1"/>
<text x="97.0" y="701.0" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#1B241C" text-anchor="middle">Retake</text>
<text x="251.0" y="701.0" font-family="Fredoka,'Baloo 2','Liberation Sans',sans-serif" font-size="14" font-weight="600" fill="#196D2E" text-anchor="middle">Enter by hand</text>
<rect x="126.0" y="790" width="108" height="4" fill="#6D7B6D" rx="2" opacity="0.5"/>
</svg>
