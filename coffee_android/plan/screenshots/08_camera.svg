<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Helvetica,Arial,sans-serif">
  <title>Camera Capture — wireframe</title>
  <rect width="320" height="680" rx="28" fill="#0B0B0C"/>
  <rect width="320" height="28" fill="#0B0B0C"/>
  <text x="160" y="18" font-size="10" text-anchor="middle" fill="#8E8E93">9:41</text>
  <text x="16" y="52" font-size="15" fill="#FFFFFF">✕</text>
  <text x="160" y="52" font-size="12" text-anchor="middle" fill="#FFFFFF">Scan bean label</text>

  <!-- live preview area -->
  <rect x="16" y="80" width="288" height="440" rx="16" fill="#1C1C1E" stroke="#3A3A3C"/>
  <text x="160" y="300" font-size="11" text-anchor="middle" fill="#636366">CameraX PreviewView (live)</text>
  <rect x="46" y="140" width="228" height="290" fill="none" stroke="#34C759" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="160" y="440" font-size="10" text-anchor="middle" fill="#8E8E93">Align the label inside the frame</text>

  <!-- shutter -->
  <circle cx="160" cy="580" r="34" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="160" cy="580" r="26" fill="#FFFFFF"/>

  <rect x="30" y="562" width="56" height="36" rx="10" fill="#1C1C1E"/>
  <text x="58" y="584" font-size="9" text-anchor="middle" fill="#FFFFFF">Cancel</text>
  <text x="12" y="650" font-size="9" fill="#636366">Capture → returns local file path to Bean Detail</text>
  <text x="12" y="662" font-size="9" fill="#636366">→ POST /v1/vision. EXIF location stripped on save.</text>
</svg>
