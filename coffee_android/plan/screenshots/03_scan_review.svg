<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Helvetica,Arial,sans-serif">
  <title>Scan Review — wireframe</title>
  <rect width="320" height="680" rx="28" fill="#F2F2F7"/>
  <!-- dimmed bean detail behind -->
  <rect width="320" height="680" fill="#000000" opacity="0.35"/>
  <!-- bottom sheet -->
  <rect x="0" y="280" width="320" height="400" rx="20" fill="#FFFFFF"/>
  <rect x="140" y="294" width="40" height="4" rx="2" fill="#D1D1D6"/>
  <text x="160" y="322" font-size="15" font-weight="bold" text-anchor="middle" fill="#1C1C1E">Review scanned fields</text>
  <text x="160" y="340" font-size="10" text-anchor="middle" fill="#8E8E93">Edit anything before applying</text>

  <rect x="20" y="356" width="280" height="36" rx="10" fill="#F2F2F7"/>
  <text x="30" y="370" font-size="9" fill="#8E8E93">NAME</text>
  <text x="30" y="384" font-size="12" fill="#1C1C1E">Ethiopia Guji Natural</text>

  <rect x="20" y="400" width="280" height="36" rx="10" fill="#F2F2F7"/>
  <text x="30" y="414" font-size="9" fill="#8E8E93">ORIGIN</text>
  <text x="30" y="428" font-size="12" fill="#1C1C1E">Guji, Ethiopia</text>

  <rect x="20" y="444" width="280" height="36" rx="10" fill="#F2F2F7"/>
  <text x="30" y="458" font-size="9" fill="#8E8E93">PROCESS</text>
  <text x="30" y="472" font-size="12" fill="#1C1C1E">Natural</text>

  <rect x="20" y="488" width="280" height="36" rx="10" fill="#F2F2F7"/>
  <text x="30" y="502" font-size="9" fill="#8E8E93">ROAST DATE</text>
  <text x="30" y="516" font-size="12" fill="#1C1C1E">2026-07-28</text>

  <text x="30" y="546" font-size="10" fill="#AEAEB2">(altitude, roaster, producer — same pattern)</text>

  <rect x="20" y="600" width="130" height="42" rx="21" fill="#F2F2F7"/>
  <text x="85" y="626" font-size="12" text-anchor="middle" fill="#3A3A3C">Discard</text>
  <rect x="170" y="600" width="130" height="42" rx="21" fill="#34C759"/>
  <text x="235" y="626" font-size="12" text-anchor="middle" fill="#FFFFFF">Apply</text>
</svg>
