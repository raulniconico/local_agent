<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Helvetica,Arial,sans-serif">
  <title>Ask-AI Suggestion — wireframe</title>
  <rect width="320" height="680" rx="28" fill="#F2F2F7"/>
  <rect width="320" height="680" fill="#000000" opacity="0.35"/>
  <rect x="0" y="220" width="320" height="460" rx="20" fill="#FFFFFF"/>
  <rect x="140" y="234" width="40" height="4" rx="2" fill="#D1D1D6"/>
  <text x="160" y="262" font-size="15" font-weight="bold" text-anchor="middle" fill="#1C1C1E">Ask AI for a recipe</text>
  <text x="160" y="280" font-size="10" text-anchor="middle" fill="#8E8E93">Ethiopia Guji Natural</text>

  <rect x="20" y="296" width="280" height="40" rx="12" fill="#F2F2F7"/>
  <text x="30" y="312" font-size="9" fill="#8E8E93">DRIPPER ▾</text>
  <text x="30" y="328" font-size="12" fill="#1C1C1E">Hario V60</text>

  <rect x="20" y="348" width="280" height="36" rx="18" fill="#34C759"/>
  <text x="160" y="370" font-size="12" text-anchor="middle" fill="#FFFFFF">Get Suggestion</text>

  <rect x="20" y="398" width="280" height="180" rx="12" fill="#F2F2F7"/>
  <text x="32" y="418" font-size="10" fill="#8E8E93">SUGGESTION</text>
  <text x="32" y="436" font-size="11" fill="#1C1C1E">Bright, floral cup — bloom heavy,</text>
  <text x="32" y="450" font-size="11" fill="#1C1C1E">pour in 2 stages.</text>
  <text x="32" y="470" font-size="10" fill="#8E8E93">Dose 15g · Grind: medium-fine (22 clicks)</text>
  <text x="32" y="490" font-size="10" fill="#8E8E93">1. 93°C · 50g · 0:30 · circling</text>
  <text x="32" y="506" font-size="10" fill="#8E8E93">2. 92°C · 200g · 1:45 · no circling</text>
  <text x="32" y="530" font-size="9" fill="#AEAEB2">via POST /v1/ask (provider=qwen)</text>

  <rect x="20" y="600" width="130" height="42" rx="21" fill="#F2F2F7"/>
  <text x="85" y="626" font-size="12" text-anchor="middle" fill="#3A3A3C">Cancel</text>
  <rect x="170" y="600" width="130" height="42" rx="21" fill="#34C759"/>
  <text x="235" y="626" font-size="12" text-anchor="middle" fill="#FFFFFF">Create Session</text>
</svg>
